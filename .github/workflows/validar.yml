name: Validar datos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar la API desde data/dta.json
        run: python scripts/generar_api.py
      - name: Los archivos de public/ deben estar al día
        run: git diff --exit-code -- public/ || (echo "Corré scripts/generar_api.py y subí el resultado" && exit 1)
      - name: Validar totales y códigos
        run: python scripts/validar.py
